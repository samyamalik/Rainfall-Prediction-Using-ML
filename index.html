<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Rainfall Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
            border-radius: 8px;
        }
        h1 {
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
        }
        input {
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #28a745;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .result {
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<h1>Rainfall Prediction</h1>

<form method="POST">
    <label>Pressure (hPa):</label>
    <input type="number" name="pressure" step="0.1" required>

    <label>Dew Point (°C):</label>
    <input type="number" name="dewpoint" step="0.1" required>

    <label>Humidity (%):</label>
    <input type="number" name="humidity" required>

    <label>Cloud Cover (%):</label>
    <input type="number" name="cloud" required>

    <label>Sunshine (hours):</label>
    <input type="number" name="sunshine" step="0.1" required>

    <label>Wind Direction (°):</label>
    <input type="number" name="winddirection" step="0.1" required>

    <label>Wind Speed (km/h):</label>
    <input type="number" name="windspeed" step="0.1" required>

    <button type="submit">Predict</button>
</form>

<div class="result">
    {{ prediction_text }}
</div>

</body>
</html>
